<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HPS-DOOM">
  <defs>
    <!-- Cuerpo verde del icono, con la luz cayendo desde arriba a la izquierda. -->
    <linearGradient id="cuerpo" x1="0.18" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7ed39a" />
      <stop offset="0.45" stop-color="#5fbe83" />
      <stop offset="1" stop-color="#42a468" />
    </linearGradient>

    <!-- La H va de frío a cálido: cian por el canto izquierdo, oro por el derecho. -->
    <linearGradient id="letra" x1="0" y1="0.15" x2="1" y2="0.9">
      <stop offset="0" stop-color="#eafaff" />
      <stop offset="0.42" stop-color="#ffffff" />
      <stop offset="1" stop-color="#fdf3d4" />
    </linearGradient>
    <linearGradient id="canto" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc7e0" />
      <stop offset="0.5" stop-color="#bfe9d2" />
      <stop offset="1" stop-color="#e8b93f" />
    </linearGradient>

    <!-- Halo suave detrás de la letra, como en el icono original. -->
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="132" ry="132" fill="url(#cuerpo)" />

  <!-- Brillo interior del borde superior. -->
  <rect x="6" y="6" width="500" height="500" rx="127" ry="127"
        fill="none" stroke="#a6e4bb" stroke-opacity="0.55" stroke-width="6" />

  <g transform="translate(256 262)">
    <path id="h" d="M-78 -104 h50 v76 h56 v-76 h50 v208 h-50 v-80 h-56 v80 h-50 z"
          fill="#dff7e8" filter="url(#halo)" opacity="0.85" />
    <use href="#h" fill="url(#canto)" transform="translate(-5 0)" />
    <use href="#h" fill="url(#canto)" transform="translate(5 0)" />
    <use href="#h" fill="url(#letra)" />
  </g>
</svg>
